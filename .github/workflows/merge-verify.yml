name: Merge Verify

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  merge-verify:
    name: Merge Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install web dependencies
        run: cd web && npm ci

      - name: Install Python test dependencies
        run: |
          python -m pip install pytest
          python -m pip install \
            -r agent/requirements.txt \
            -r scripts/v2/incident/requirements.txt \
            -r scripts/v2/remediation/requirements.txt \
            -r scripts/v2/steampipe/requirements.txt \
            -r scripts/v2/workers/requirements.txt

      - name: Run merge verification
        run: bash scripts/v2/merge-verify.sh

  # Pre-merge mirror of deploy-guide.yml's deck gates, so a sensitive-content
  # leak or generator drift in the committed pptx is caught BEFORE the binary
  # enters public git history (deploy-guide runs post-merge and can only block
  # serving). Runs on a hosted runner — no credentials involved.
  deck-verify:
    name: Deck Verify (docs-site pptx gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install docs-site dependencies
        run: cd docs-site && npm ci

      - name: Deck gates (structure + content scan + generator parity + no external targets)
        working-directory: docs-site
        run: |
          DECK=static/presentation/awsops-intro/awsops-intro.pptx
          test -s "$DECK" || { echo "::error::awsops-intro.pptx missing or empty"; exit 1; }
          [ "$(head -c 4 "$DECK" | od -An -tx1 | tr -d ' \n')" = "504b0304" ] || { echo "::error::awsops-intro.pptx is not a valid zip/pptx container"; exit 1; }
          ! unzip -Z1 "$DECK" | grep -qE 'vbaProject\.bin|^ppt/embeddings/.' || { echo "::error::deck contains macros or embedded objects"; exit 1; }
          unzip -l "$DECK" | grep -q 'ppt/presentation.xml' || { echo "::error::awsops-intro.pptx lacks ppt/presentation.xml"; exit 1; }
          XML=$(unzip -p "$DECK" '*.xml' '*.rels' -x 'ppt/theme/*') || { echo "::error::deck XML parts unreadable"; exit 1; }
          test -n "$XML" || { echo "::error::deck content scan extracted zero bytes"; exit 1; }
          grep -aqE '\b[0-9]{12}\b|arn:aws[a-z-]*:|(AKIA|ASIA)[0-9A-Z]{16}|PRIVATE KEY|eyJ[A-Za-z0-9_-]{20,}|[a-z]{2}-[a-z]+-[0-9]_[A-Za-z0-9]{9}|atomai\.click|\.amazonaws\.com|[a-z0-9]{13,14}\.cloudfront\.net|AWSops[A-Za-z]*Role|\b(vpc|sg|subnet|eni|i|vol|ami|snap)-[0-9a-f]{8,17}\b|\b10\.[0-9]+\.[0-9]+\.[0-9]+\b|\b172\.(1[6-9]|2[0-9]|3[01])\.[0-9]+\.[0-9]+\b|\b192\.168\.[0-9]+\.[0-9]+\b' <<<"$XML" && RC=0 || RC=$?
          if [ "$RC" -eq 0 ]; then echo "::error::deck content contains a sensitive identifier"; exit 1;
          elif [ "$RC" -ne 1 ]; then echo "::error::deck content scan failed (grep exit $RC)"; exit 1; fi
          # second pass with tags stripped to EMPTY (not space) so text split across
          # OOXML <a:t> runs concatenates — the spaced first pass would miss e.g. an
          # account ID emitted as two adjacent runs
          grep -aqE '\b[0-9]{12}\b|arn:aws[a-z-]*:|(AKIA|ASIA)[0-9A-Z]{16}|PRIVATE KEY|eyJ[A-Za-z0-9_-]{20,}|[a-z]{2}-[a-z]+-[0-9]_[A-Za-z0-9]{9}|atomai\.click|\.amazonaws\.com|[a-z0-9]{13,14}\.cloudfront\.net|AWSops[A-Za-z]*Role|\b(vpc|sg|subnet|eni|i|vol|ami|snap)-[0-9a-f]{8,17}\b|\b10\.[0-9]+\.[0-9]+\.[0-9]+\b|\b172\.(1[6-9]|2[0-9]|3[01])\.[0-9]+\.[0-9]+\b|\b192\.168\.[0-9]+\.[0-9]+\b' <<<"$(sed -E 's/<[^>]*>//g' <<<"$XML")" && RC2=0 || RC2=$?
          if [ "$RC2" -eq 0 ]; then echo "::error::sensitive identifier found in tag-stripped deck text (split-run)"; exit 1;
          elif [ "$RC2" -ne 1 ]; then echo "::error::stripped-text scan failed (grep exit $RC2)"; exit 1; fi
          WORK=$(mktemp -d)
          trap 'rm -rf "$WORK"' EXIT
          [ "$(unzip -Z1 "$DECK" | wc -l)" -le 500 ] || { echo "::error::deck zip has an implausible number of entries"; exit 1; }
          node scripts/pptx/build-awsops-intro-pptx.js "$WORK/rebuilt-deck.pptx"
          diff <(unzip -Z1 "$DECK" | sort) <(unzip -Z1 "$WORK/rebuilt-deck.pptx" | sort) || { echo "::error::pptx part list differs from generator output"; exit 1; }
          unzip -q "$DECK" -d "$WORK/committed"
          unzip -q "$WORK/rebuilt-deck.pptx" -d "$WORK/rebuilt"
          sed -i -E 's#<dcterms:(created|modified)[^<]*</dcterms:(created|modified)>##g' "$WORK/committed/docProps/core.xml" "$WORK/rebuilt/docProps/core.xml"
          diff -r "$WORK/committed" "$WORK/rebuilt" || { echo "::error::committed pptx does not match generator output"; exit 1; }
          if grep -rl 'TargetMode="External"' "$WORK/committed" --include='*.rels'; then echo "::error::external relationship target in deck"; exit 1; fi
          echo "Deck verified pre-merge: structure, content scan, generator parity, no external targets."
