<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <title>AWSops Product Tour</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      @font-face {
        font-family: "Noto Sans CJK KR";
        src: local("Noto Sans CJK KR");
      }

      html,
      body {
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #0a0e1a;
        font-family: "Noto Sans CJK KR", system-ui, sans-serif;
      }

      #root {
        position: relative;
        width: 1280px;
        height: 720px;
        overflow: hidden;
      }

      /* Persistent backdrop — not a timed clip, stays for the whole render */
      #backdrop {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 30% 20%, #10182c 0%, #0a0e1a 60%, #060911 100%);
      }

      .clip {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* ---- Title / outro text scenes ---- */
      .text-scene {
        flex-direction: column;
        gap: 18px;
        text-align: center;
      }
      .brand {
        font-size: 88px;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: 1px;
      }
      .tagline {
        font-size: 30px;
        font-weight: 500;
        color: #00d4ff;
      }
      .outro-note {
        font-size: 22px;
        font-weight: 500;
        color: #94a3b8;
      }

      /* ---- Screenshot scenes ---- */
      .shot-frame {
        position: relative;
        width: 1120px;
        height: 630px;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
        border: 1px solid #1a2540;
      }
      /* Ultra-wide banner captures (e.g. the compliance strip, 8.4:1) — full width, natural
         aspect, no crop. A deliberate change of rhythm rather than forcing a tall crop.
         The label sits below as a normal-flow sibling, not an absolutely-positioned child —
         .shot-frame-banner's own overflow:hidden would otherwise clip an out-of-bounds label. */
      .banner-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
      }
      .shot-frame-banner {
        position: relative;
        width: 1120px;
        height: 133px;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
        border: 1px solid #1a2540;
      }
      .shot-label-banner {
        position: static;
      }
      .shot-img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top center;
        transform-origin: center center;
      }
      .shot-label {
        position: absolute;
        left: 32px;
        bottom: 28px;
        display: inline-flex;
        align-items: center;
        padding: 12px 22px;
        border-radius: 999px;
        background: #060911;
        border: 1px solid rgba(0, 212, 255, 0.4);
        color: #e2e8f0;
        font-size: 24px;
        font-weight: 600;
      }
      .shot-frame-banner .shot-label {
        left: 50%;
        bottom: -56px;
        transform: translateX(-50%);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="product-tour"
      data-start="0"
      data-duration="30"
      data-width="1280"
      data-height="720"
    >
      <div id="backdrop"></div>

      <!-- 0.0 - 1.5s: title -->
      <section id="scene-title" class="clip text-scene" data-start="0" data-duration="1.5" data-track-index="1">
        <div class="brand">AWSops</div>
        <div class="tagline">AWS + Kubernetes 운영을 한 화면에서</div>
      </section>

      <!-- 1.5 - 6.0s: dashboard -->
      <section
        id="scene-dashboard"
        class="clip"
        data-start="1.5"
        data-duration="4.5"
        data-track-index="2"
      >
        <div class="shot-frame" data-layout-allow-overflow="true">
          <img id="img-dashboard" class="shot-img" src="assets/dashboard.webp" alt="" />
          <div id="label-dashboard" class="shot-label">한눈에 보는 대시보드</div>
        </div>
      </section>

      <!-- 6.0 - 10.5s: AI assistant -->
      <section
        id="scene-assistant"
        class="clip"
        data-start="6.0"
        data-duration="4.5"
        data-track-index="1"
      >
        <div class="shot-frame" data-layout-allow-overflow="true">
          <img id="img-assistant" class="shot-img" src="assets/assistant-answer.webp" alt="" />
          <div id="label-assistant" class="shot-label">AI 어시스턴트</div>
        </div>
      </section>

      <!-- 10.5 - 15.0s: topology -->
      <section
        id="scene-topology"
        class="clip"
        data-start="10.5"
        data-duration="4.5"
        data-track-index="2"
      >
        <div class="shot-frame" data-layout-allow-overflow="true">
          <img id="img-topology" class="shot-img" src="assets/topology.webp" alt="" />
          <div id="label-topology" class="shot-label">토폴로지</div>
        </div>
      </section>

      <!-- 15.0 - 19.5s: cost explorer -->
      <section
        id="scene-cost"
        class="clip"
        data-start="15.0"
        data-duration="4.5"
        data-track-index="1"
      >
        <div class="shot-frame" data-layout-allow-overflow="true">
          <img id="img-cost" class="shot-img" src="assets/cost-explorer.webp" alt="" />
          <div id="label-cost" class="shot-label">비용 분석</div>
        </div>
      </section>

      <!-- 19.5 - 24.0s: compliance (ultra-wide banner, no crop) -->
      <section
        id="scene-compliance"
        class="clip"
        data-start="19.5"
        data-duration="4.5"
        data-track-index="2"
      >
        <div class="banner-wrap" data-layout-allow-overflow="true">
          <div class="shot-frame-banner">
            <img id="img-compliance" class="shot-img" src="assets/compliance.webp" alt="" />
          </div>
          <div id="label-compliance" class="shot-label shot-label-banner">보안 · 컴플라이언스</div>
        </div>
      </section>

      <!-- 24.0 - 28.5s: AI diagnosis -->
      <section
        id="scene-diagnosis"
        class="clip"
        data-start="24.0"
        data-duration="4.5"
        data-track-index="1"
      >
        <div class="shot-frame" data-layout-allow-overflow="true">
          <img id="img-diagnosis" class="shot-img" src="assets/ai-diagnosis.webp" alt="" />
          <div id="label-diagnosis" class="shot-label">AI 진단</div>
        </div>
      </section>

      <!-- 28.5 - 30.0s: outro (holds to the final frame) -->
      <section id="scene-outro" class="clip text-scene" data-start="28.5" data-duration="1.5" data-track-index="2">
        <div class="brand">AWSops</div>
        <div class="outro-note">읽기 전용 운영 대시보드</div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ---- title (0 - 1.5) ----
      const TITLE_SEL = "#scene-title .brand, #scene-title .tagline";
      tl.from("#scene-title .brand", { autoAlpha: 0, y: 24, duration: 0.5, ease: "power2.out" }, 0.1);
      tl.from("#scene-title .tagline", { autoAlpha: 0, y: 16, duration: 0.5, ease: "power2.out" }, 0.3);
      tl.to(TITLE_SEL, { autoAlpha: 0, duration: 0.3, ease: "power1.in" }, 1.2);
      tl.set(TITLE_SEL, { autoAlpha: 0 }, 1.5);

      // ---- reusable per-scene reveal + Ken Burns + label ----
      function scene(imgSel, labelSel, start, duration, panScale) {
        const fade = 0.4;
        const end = start + duration;
        // scale: slow constant Ken Burns zoom across the whole visible span
        tl.fromTo(imgSel, { scale: panScale[0] }, { scale: panScale[1], duration: duration, ease: "none" }, start);
        // image visibility: quick fade in, hold, quick fade out, then a hard kill at the boundary
        tl.fromTo(imgSel, { autoAlpha: 0 }, { autoAlpha: 1, duration: fade, ease: "power2.out" }, start);
        tl.to(imgSel, { autoAlpha: 0, duration: fade, ease: "power1.in" }, end - fade);
        tl.set(imgSel, { autoAlpha: 0 }, end);
        // label: slide up + fade in shortly after the image starts, hold, fade with scene end
        tl.from(labelSel, { autoAlpha: 0, y: 20, duration: 0.4, ease: "power2.out" }, start + 0.3);
        tl.to(labelSel, { autoAlpha: 0, duration: fade, ease: "power1.in" }, end - fade);
        tl.set(labelSel, { autoAlpha: 0 }, end);
      }

      scene("#img-dashboard", "#label-dashboard", 1.5, 4.5, [1.08, 1.0]);
      scene("#img-assistant", "#label-assistant", 6.0, 4.5, [1.0, 1.06]);
      scene("#img-topology", "#label-topology", 10.5, 4.5, [1.06, 1.0]);
      scene("#img-cost", "#label-cost", 15.0, 4.5, [1.0, 1.06]);
      scene("#img-compliance", "#label-compliance", 19.5, 4.5, [1.02, 1.0]);
      scene("#img-diagnosis", "#label-diagnosis", 24.0, 4.5, [1.0, 1.06]);

      // ---- outro (28.5 - 30.0): fades in and HOLDS — final frame is part of the animation ----
      tl.from("#scene-outro .brand", { autoAlpha: 0, y: 16, duration: 0.5, ease: "power2.out" }, 28.7);
      tl.from("#scene-outro .outro-note", { autoAlpha: 0, y: 12, duration: 0.5, ease: "power2.out" }, 28.9);

      window.__timelines["product-tour"] = tl;
    </script>
  </body>
</html>
