name: Merge Verify

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  merge-verify:
    name: Merge Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.7
          terraform_wrapper: false

      - name: Offline AI review reliability regressions
        run: |
          python3 -m unittest discover -s scripts/pr-review -p 'test_*.py' -v
          bash tests/structure/test-pr-review-chair-input-caps.sh
          bash tests/structure/test-pr-review-large-diff.sh

      - name: Install web dependencies
        run: cd web && npm ci

      - name: Install Python test dependencies
        run: |
          python -m pip install pytest
          python -m pip install \
            -r agent/requirements.txt \
            -r scripts/v2/incident/requirements.txt \
            -r scripts/v2/remediation/requirements.txt \
            -r scripts/v2/steampipe/requirements.txt \
            -r scripts/v2/workers/requirements.txt

      - name: Run merge verification
        run: bash scripts/v2/merge-verify.sh

      - name: Verify migration TLS chain and hostname checks
        run: node --test scripts/v2/migrate-tls.test.mjs scripts/v2/migration-context.test.mjs

      - name: Verify runtime IAM with mocked providers
        working-directory: terraform/v2/foundation
        env:
          AWS_EC2_METADATA_DISABLED: "true"
          AWS_CONFIG_FILE: /dev/null
          AWS_SHARED_CREDENTIALS_FILE: /dev/null
        run: |
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate
          terraform test -filter=tests/runtime_iam.tftest.hcl -filter=tests/github_actions_release.tftest.hcl

  # Pre-merge mirror of deploy-guide.yml's deck gates, so a sensitive-content
  # leak or generator drift in the committed pptx is caught BEFORE the binary
  # enters public git history (deploy-guide runs post-merge and can only block
  # serving). Runs on a hosted runner — no credentials involved.
  deck-verify:
    name: Deck Verify (docs-site pptx gates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false  # gates only read the tree — no git credentials needed after checkout

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install docs-site dependencies
        run: cd docs-site && npm ci

      - name: Deck gates (shared script — mirrors deploy-guide pre-deploy run)
        working-directory: docs-site
        run: bash scripts/verify-deck.sh static/presentation/awsops-intro/awsops-intro.pptx
