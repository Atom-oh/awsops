name: Deploy Guide to GitHub Pages

# NOTE: upstream (whchoi98/awsops) lacks the fork's self-hosted runner
# 'awsops-claude-arm', so a bring-up commit (20abf6cd) dropped this to
# workflow_dispatch-only "for upstream" — but that landed on THIS fork's main
# via the routine upstream-sync merge too, silently disabling auto-deploy on
# every docs-site push since 2026-07-20. The runner is alive here (EKS Pod
# Identity + Bedrock us-east-1 on mall-apne2-mgmt), so restore the real trigger.
on:
  push:
    branches: [main]
    paths: ['docs-site/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: awsops-claude-arm
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - run: npm ci

      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          SITE_URL: ${{ vars.SITE_URL || 'https://www.atomai.click' }}
          BASE_URL: ${{ vars.BASE_URL || '/awsops/' }}

      # Canary: fail loudly if the customer overview page is missing from the
      # build, so we never silently deploy an incomplete docs site again.
      - name: Verify build completeness
        run: |
          test -f build/sitemap.xml || { echo "::error::sitemap.xml missing"; exit 1; }
          if ! grep -q "overview/why-awsops" build/sitemap.xml; then
            echo "::error::overview/why-awsops missing from sitemap — build is incomplete"
            exit 1
          fi
          echo "Build verified: overview/why-awsops present in sitemap."
          # Presentation deck download asset — a missing binary would ship as a
          # 404 that the <a download> attribute silently saves as a corrupt file.
          # Check non-empty AND zip magic AND real pptx structure, not just existence.
          DECK=build/presentation/awsops-intro/awsops-intro.pptx
          test -s "$DECK" || { echo "::error::awsops-intro.pptx missing or empty in build"; exit 1; }
          [ "$(head -c 4 "$DECK" | od -An -tx1 | tr -d ' \n')" = "504b0304" ] || { echo "::error::awsops-intro.pptx is not a valid zip/pptx container"; exit 1; }
          unzip -l "$DECK" | grep -q 'ppt/presentation.xml' || { echo "::error::awsops-intro.pptx lacks ppt/presentation.xml — not a real pptx"; exit 1; }
          # Content scan — the deck ships to an unauthenticated public site. Fail CLOSED:
          # capture the extraction, assert it succeeded and is non-empty, then grep.
          # theme XML is excluded (panose font metadata false-positives the account-ID
          # pattern); embedded images need manual review — grep cannot see pixels.
          XML=$(unzip -p "$DECK" '*.xml' '*.rels' -x 'ppt/theme/*') || { echo "::error::deck XML parts unreadable"; exit 1; }
          test -n "$XML" || { echo "::error::deck content scan extracted zero bytes"; exit 1; }
          # herestring (not printf|grep) so the check stays correct even if a
          # future `shell: bash` override enables pipefail on this step.
          # Exit codes handled explicitly: 0 = leak found, 1 = clean, ≥2 = scan
          # error — only 1 passes (a broken grep must not read as clean).
          grep -aqE '\b[0-9]{12}\b|arn:aws[a-z-]*:|(AKIA|ASIA)[0-9A-Z]{16}|PRIVATE KEY|eyJ[A-Za-z0-9_-]{20,}|[a-z]{2}-[a-z]+-[0-9]_[A-Za-z0-9]{9}|atomai\.click|\.amazonaws\.com|[a-z0-9]{13,14}\.cloudfront\.net|AWSops[A-Za-z]*Role|\b(vpc|sg|subnet|eni|i|vol|ami|snap)-[0-9a-f]{8,17}\b|\b10\.[0-9]+\.[0-9]+\.[0-9]+\b|\b172\.(1[6-9]|2[0-9]|3[01])\.[0-9]+\.[0-9]+\b|\b192\.168\.[0-9]+\.[0-9]+\b' <<<"$XML" && RC=0 || RC=$?
          if [ "$RC" -eq 0 ]; then
            echo "::error::awsops-intro.pptx content contains a sensitive identifier (account ID / ARN / access key / internal hostname / resource ID)"
            exit 1
          elif [ "$RC" -ne 1 ]; then
            echo "::error::deck content scan failed to run (grep exit $RC)"
            exit 1
          fi
          # second pass on tag-stripped text — catches identifiers split across OOXML <a:t> runs
          grep -aqE '\b[0-9]{12}\b|arn:aws[a-z-]*:|(AKIA|ASIA)[0-9A-Z]{16}|PRIVATE KEY|eyJ[A-Za-z0-9_-]{20,}|[a-z]{2}-[a-z]+-[0-9]_[A-Za-z0-9]{9}|atomai\.click|\.amazonaws\.com|[a-z0-9]{13,14}\.cloudfront\.net|AWSops[A-Za-z]*Role|\b(vpc|sg|subnet|eni|i|vol|ami|snap)-[0-9a-f]{8,17}\b|\b10\.[0-9]+\.[0-9]+\.[0-9]+\b|\b172\.(1[6-9]|2[0-9]|3[01])\.[0-9]+\.[0-9]+\b|\b192\.168\.[0-9]+\.[0-9]+\b' <<<"$(sed -E 's/<[^>]*>/ /g' <<<"$XML")" && RC2=0 || RC2=$?
          if [ "$RC2" -eq 0 ]; then echo "::error::sensitive identifier found in tag-stripped deck text (split-run)"; exit 1;
          elif [ "$RC2" -ne 1 ]; then echo "::error::stripped-text scan failed (grep exit $RC2)"; exit 1; fi
          echo "Build verified: awsops-intro.pptx present, well-formed, and content-scanned."

      # The served .pptx is a committed binary; prove it is exactly what the
      # reviewed generator script produces, so the script stays the enforced
      # source of truth and a hand-swapped or drifted binary cannot ship.
      # Coverage: full part list + full-archive content diff (every part incl.
      # ppt/media/* and *_rels; only docProps/core.xml is excluded — it carries
      # the volatile creation timestamp) + no external relationship targets.
      # The generator build is deterministic across runs for all compared parts.
      # Determinism assumption: diff -r needs byte-identical parts from every
      # rebuild, which holds because pptxgenjs is lockfile-pinned (4.0.1) and
      # the generator takes no time/random input; a transitive bump that broke
      # this would surface here as a parity failure, pointing at the lockfile.
      # mktemp -d (not fixed /tmp names): this runs on a persistent self-hosted
      # runner where predictable world-writable paths invite symlink games.
      - name: Verify deck matches generator
        run: |
          # Gate the same artifact that ships: build/ (what upload-pages-artifact
          # publishes), not the static/ source it was copied from.
          DECK=build/presentation/awsops-intro/awsops-intro.pptx
          WORK=$(mktemp -d)
          trap 'rm -rf "$WORK"' EXIT
          [ "$(unzip -Z1 "$DECK" | wc -l)" -le 500 ] || { echo "::error::deck zip has an implausible number of entries"; exit 1; }
          node scripts/pptx/build-awsops-intro-pptx.js "$WORK/rebuilt-deck.pptx"
          diff <(unzip -Z1 "$DECK" | sort) <(unzip -Z1 "$WORK/rebuilt-deck.pptx" | sort) || { echo "::error::pptx part list differs from generator output — extra or missing package parts"; exit 1; }
          unzip -q "$DECK" -d "$WORK/committed"
          unzip -q "$WORK/rebuilt-deck.pptx" -d "$WORK/rebuilt"
          # docProps/core.xml stays in the diff; strip only its volatile
          # dcterms:created/modified timestamps so title/creator drift is caught.
          sed -i -E 's#<dcterms:(created|modified)[^<]*</dcterms:(created|modified)>##g' "$WORK/committed/docProps/core.xml" "$WORK/rebuilt/docProps/core.xml"
          diff -r "$WORK/committed" "$WORK/rebuilt" || { echo "::error::committed awsops-intro.pptx does not match the generator output — run 'node scripts/pptx/build-awsops-intro-pptx.js' and re-commit"; exit 1; }
          if grep -rl 'TargetMode="External"' "$WORK/committed" --include='*.rels'; then
            echo "::error::deck contains external relationship targets — not allowed for the published deck"
            exit 1
          fi
          echo "Deck verified: committed pptx matches generator output (full archive), no external targets."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/build

  deploy:
    needs: build
    runs-on: awsops-claude-arm
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
